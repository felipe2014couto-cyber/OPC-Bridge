[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opc-bridge"
version = "0.1.0"
description = "Central server and Windows agent for OPC DA reading"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Proprietary"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff>=0.4"]
windows = ["pywin32>=306"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.pytest.ini_options]
asyncio_mode = "auto"