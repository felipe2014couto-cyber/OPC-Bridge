[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opc-bridge"
version = "0.1.0"
description = "Central server and Windows agent for OPC DA reading"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Proprietary"}
dependencies = []

[project.scripts]
opc-bridge-server = "opc_bridge.server.launcher:main"
opc-bridge-agent-credential = "opc_bridge.server.credential_admin:main"
opc-bridge-retention = "opc_bridge.server.retention_cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff>=0.4"]
windows = ["pywin32>=306"]
persistence = ["psycopg2-binary>=2.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"opc_bridge.server.admin" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]

[tool.ruff.lint.per-file-ignores]
"src/opc_bridge/server/persistence/*.py" = ["UP006", "UP045"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
